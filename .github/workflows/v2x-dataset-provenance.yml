name: External V2X Dataset Provenance Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/v2x/audit_external_dataset.py"
      - "experiments/v2x/test_audit_external_dataset.py"
      - ".github/workflows/v2x-dataset-provenance.yml"
  push:
    branches: [main]
    paths:
      - "experiments/v2x/audit_external_dataset.py"
      - "experiments/v2x/test_audit_external_dataset.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q experiments/v2x/audit_external_dataset.py experiments/v2x/test_audit_external_dataset.py
      - name: Reject tampered sources and split leakage
        env:
          PYTHONPATH: experiments/v2x
        run: python -m unittest discover -s experiments/v2x -p "test_audit_external_dataset.py" -v
