name: Windows Runtime Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - release/**
      - ui/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Python runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "Pillow>=10.2.0"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go/go.mod

      - name: Compile Windows runtime smoke modules
        shell: pwsh
        run: |
          python -m py_compile dashboard.py dashboard_modern_ui.py dashboard_production_ui.py dashboard_reference_ui.py dashboard_pixel_ui.py dashboard_live_ui.py dashboard_vehicle_art.py runtime_backend_patch.py smartcar_backend.py scripts/bootstrap_local_env.py scripts/ci_windows_go_backend_smoke.py

      - name: Run local bootstrap, readiness, and dashboard UI regressions
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          $env:SMARTCAR_V2X_SHARED_SECRET = python -c "import secrets; print(secrets.token_urlsafe(48))"
          python -m unittest -v tests.test_local_env_bootstrap
          python -m unittest -v tests.test_runtime_backend_readiness
          python -m unittest -v tests.test_dashboard_navigation
          python -m unittest -v tests.test_dashboard_overview_contract
          python -m unittest -v tests.test_dashboard_reference_ui
          python -m unittest -v tests.test_dashboard_pixel_ui
          python -m unittest -v tests.test_dashboard_live_ui

      - name: Run Go tests and build fresh Windows backend
        shell: pwsh
        working-directory: api/go
        run: |
          gofmt -w .
          go test ./... -count=1
          New-Item -ItemType Directory -Force -Path ..\..\build | Out-Null
          go build -trimpath -o ..\..\build\smartcar_go_backend.exe .

      - name: Run authenticated real-process Windows smoke
        shell: pwsh
        env:
          PYTHONPATH: .
        run: python scripts/ci_windows_go_backend_smoke.py

      - name: Verify loopback backends were cleaned up
        if: always()
        shell: pwsh
        run: |
          foreach ($port in 8787, 8788) {
            $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($listener) {
              Write-Error "Port $port is still listening after the Windows runtime smoke."
              Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)" |
                Select-Object ProcessId, Name, ExecutablePath, CommandLine
              exit 1
            }
          }

      - name: Show backend diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path .\logs\processes\go-backend.log) {
            Get-Content .\logs\processes\go-backend.log -Tail 120
          }
