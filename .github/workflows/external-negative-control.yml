name: External Real-World V2X Negative Control

on:
  pull_request:
    paths:
      - 'experiments/datasets/external_negative_control.py'
      - 'tests/test_external_negative_control.py'
      - '.github/workflows/external-negative-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-real-publisher-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify parser and claim-boundary regression tests
        run: python -m unittest tests.test_external_negative_control -v
      - name: Fetch independently published real-world CAM CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/real-v2x-source"
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 20 --max-time 300 \
            'https://zenodo.org/records/21644263/files/cam.csv?download=1' \
            --output "$RUNNER_TEMP/real-v2x-source/cam.csv"
          echo '8e4e0dfde05fa46b4f66bf92efbbe70f  '"$RUNNER_TEMP/real-v2x-source/cam.csv" | md5sum --check -
      - name: Audit authentic CAM data without manufacturing incidents
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.datasets.external_negative_control \
            --source "$RUNNER_TEMP/real-v2x-source/cam.csv" \
            --output "$RUNNER_TEMP/real-v2x-source/verified_source_report.json"
          python -c 'import json,os,pathlib; x=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"real-v2x-source/verified_source_report.json").read_text()); assert x["observed_cam_rows"]>0 and x["v2x_incident_accuracy_measurable"] is False and x["direct_independent_collision_truth_verified"] is False and x["physical_hil_validated"] is False; print("Source-backed descriptive audit passed")'
      - uses: actions/upload-artifact@v4
        with:
          name: real-world-negative-control-report-only
          path: ${{ runner.temp }}/real-v2x-source/verified_source_report.json
          retention-days: 30
          if-no-files-found: error
