name: Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - security/**
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go/go.mod

      - name: Compile hardened Python modules
        run: |
          python -m py_compile release_metadata.py release_integrity.py credential_policy.py key_provider.py runtime_isolation.py runtime_security_monitor.py runtime_backend_security.py runtime_backend_patch.py incident_response.py incident_response_runtime.py incident_response_validation.py env_config.py replay_security.py permissioned_consensus.py consensus_security.py identity_security.py sync_protocol_legacy.py sync_protocol.py did_identity.py v2x_protocol.py control_api_security.py ledger_integrity.py adversarial_validation.py hil_security_validation.py smartcar_backend.py smart_contracts.py main.py
          python -m py_compile scripts/generate_sbom.py scripts/generate_provenance.py scripts/secret_scan.py

      - name: Run Python security regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_release_version
          python -m unittest -v tests.test_release_integrity
          python -m unittest -v tests.test_v303_final_hardening
          python -m unittest -v tests.test_security_baseline
          python -m unittest -v tests.test_credential_policy
          python -m unittest -v tests.test_key_runtime_security
          python -m unittest -v tests.test_permissioned_consensus
          python -m unittest -v tests.test_consensus_security
          python -m unittest -v tests.test_identity_security
          python -m unittest -v tests.test_sync_protocol_security
          python -m unittest -v tests.test_replay_flood_security
          python -m unittest -v tests.test_runtime_security_monitor
          python -m unittest -v tests.test_runtime_security_hooks
          python -m unittest -v tests.test_incident_response
          python -m unittest -v tests.test_did_one_time_security
          python -m unittest -v tests.test_v2x_security
          python -m unittest -v tests.test_control_api_security
          python -m unittest -v tests.test_ledger_integrity
          python -m unittest -v tests.test_adversarial_validation
          python -m unittest -v tests.test_hil_security_validation
          python -m unittest -v tests.test_native_build_security
          python -m unittest -v tests.test_pqc_keystore_foundation
          python -m unittest -v tests.test_pqc_keystore_integration
          python -m unittest -v tests.test_pqc_key_rotation
          python -m unittest -v tests.test_pqc_trust_history

      - name: Run current-tree secret scan
        run: python scripts/secret_scan.py

      - name: Verify canonical release identity
        env:
          PYTHONPATH: .
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "3.0.3"
          python - <<'PY'
          from release_metadata import RELEASE_VERSION, release_metadata
          from security_capabilities import security_capability_output
          assert RELEASE_VERSION == "3.0.3"
          assert release_metadata()["internal_hardening_phase"] == "v3.3"
          assert security_capability_output(False)["release_version"] == "3.0.3"
          PY

      - name: Generate and verify release integrity manifest
        env:
          PYTHONPATH: .
        run: |
          python release_integrity.py --commit-sha "$GITHUB_SHA" --output security-reports/release-integrity-manifest.json
          python release_integrity.py --verify security-reports/release-integrity-manifest.json

      - name: Generate SBOM and provenance
        run: |
          python scripts/generate_sbom.py --output security-reports/sbom-v3.0.3.cdx.json
          python scripts/generate_provenance.py --commit-sha "$GITHUB_SHA" --output security-reports/provenance-v3.0.3.json

      - name: Run deterministic adversarial campaigns
        env:
          PYTHONPATH: .
        run: python adversarial_validation.py --seed 168938023 --iterations 256 --max-duration-sec 20 --output security-reports/adversarial-validation.json

      - name: Run deterministic software HIL security scenarios
        env:
          PYTHONPATH: .
        run: python hil_security_validation.py --output security-reports/hil-security-validation.json

      - name: Run deterministic incident-response scenarios
        env:
          PYTHONPATH: .
        run: python incident_response_validation.py --output security-reports/incident-response-validation.json

      - name: Verify hardened native target fails closed without liboqs
        shell: bash
        run: |
          set +e
          cmake -S . -B build/native-strict \
            -DSMARTCAR_FORCE_PQC_UNAVAILABLE_FOR_TESTS=ON \
            -DSMARTCAR_FETCH_PINNED_LIBOQS=OFF \
            -DSMARTCAR_BUILD_PQC_KEYSTORE_SELFTEST=OFF \
            -DSMARTCAR_BUILD_PQC_KEY_ADMIN=OFF \
            -DSMARTCAR_BUILD_PQC_TRUST_ADMIN=OFF \
            -DSMARTCAR_BUILD_PQC_HISTORY_VERIFY=OFF \
            -DSMARTCAR_BUILD_PQC_STATE_ADMIN=OFF \
            -DSMARTCAR_BUILD_CAMERA_MODULE=OFF \
            > build/native-strict.log 2>&1
          status=$?
          set -e
          cat build/native-strict.log
          if [ "$status" -eq 0 ]; then
            echo "Hardened native configure unexpectedly succeeded without liboqs." >&2
            exit 1
          fi
          grep -F "Real liboqs is required for the hardened native blockchain target" build/native-strict.log

      - name: Build pinned real-PQC v3.0.3 targets
        run: |
          cmake -S . -B build/native-real \
            -DSMARTCAR_FETCH_PINNED_LIBOQS=ON \
            -DSMARTCAR_BUILD_PQC_KEYSTORE_SELFTEST=ON \
            -DSMARTCAR_BUILD_PQC_KEY_ADMIN=ON \
            -DSMARTCAR_BUILD_PQC_TRUST_ADMIN=ON \
            -DSMARTCAR_BUILD_PQC_HISTORY_VERIFY=ON \
            -DSMARTCAR_BUILD_PQC_STATE_ADMIN=ON \
            -DSMARTCAR_ENABLE_NATIVE_OPT=OFF \
            -DSMARTCAR_ENABLE_UNSAFE_FAST_MATH=OFF \
            -DSMARTCAR_ENABLE_IPO=OFF \
            -DSMARTCAR_ENFORCE_VALIDATION_TOOLCHAIN=ON \
            -DSMARTCAR_BUILD_CAMERA_MODULE=OFF
          grep -F "CMAKE_PROJECT_VERSION:STATIC=3.0.3" build/native-real/CMakeCache.txt
          cmake --build build/native-real --config Release --target \
            smartcar_blockchain smartcar_pqc_keystore_selftest smartcar_pqc_key_admin \
            smartcar_pqc_trust_admin smartcar_pqc_history_verify smartcar_pqc_state_admin --parallel 2

      - name: Run secure native v3.0.3 self-test
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v303-native"
          rm -rf "$root" && mkdir -p "$root"
          export SMARTCAR_CPP_DATA_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_KEYSTORE_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_KEYSTORE_PATH="$root/identity.json"
          export SMARTCAR_CPP_PQC_PROVIDER=software_encrypted_file
          export SMARTCAR_CPP_PQC_HARDWARE_REQUIRED=0
          ./build/native-real/smartcar_blockchain --self-test
          ./build/native-real/smartcar_pqc_keystore_selftest
          ./build/native-real/smartcar_pqc_key_admin --self-test
          ./build/native-real/smartcar_pqc_trust_admin --self-test

      - name: Run mixed-generation native runtime validation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v303-mixed"
          vehicle="SMARTCAR_V303_MIXED"
          rm -rf "$root" && mkdir -p "$root"
          export SMARTCAR_CPP_DATA_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_KEYSTORE_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_KEYSTORE_PATH="$root/identity.json"
          export SMARTCAR_CPP_PQC_TRUST_KEYRING_PATH="$root/trust.json"
          export SMARTCAR_CPP_PQC_TRUST_MAX_GENERATIONS=8
          export SMARTCAR_CPP_PQC_ROTATION_ENABLED=1
          export SMARTCAR_CPP_PQC_PROVIDER=software_encrypted_file
          export SMARTCAR_CPP_PQC_HARDWARE_REQUIRED=0
          ./build/native-real/smartcar_pqc_trust_admin init --identity "$vehicle" > "$root/root.json"
          ./build/native-real/smartcar_blockchain init --identity "$vehicle" --ledger "$root/ledger.json" > "$root/initial.json"
          old_id="$(./build/native-real/smartcar_pqc_key_admin inspect --identity "$vehicle" | python -c 'import json,sys; print(json.load(sys.stdin)["key_id"])')"
          ./build/native-real/smartcar_pqc_key_admin rotate --identity "$vehicle" --reason "v3.0.3 hosted mixed generation" --confirm "ROTATE:$old_id" --rotation-dir "$root/rotations" > "$root/rotation.json"
          backup="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["backup_path"])' "$root/rotation.json")"
          new_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["new_key_id"])' "$root/rotation.json")"
          set +e
          ./build/native-real/smartcar_blockchain verify --identity "$vehicle" --ledger "$root/ledger.json" >/dev/null 2>"$root/pre-admission.err"
          pre=$?
          set -e
          test "$pre" -ne 0
          ./build/native-real/smartcar_pqc_trust_admin admit --identity "$vehicle" --previous-keystore "$backup" --reason "v3.0.3 hosted mixed generation" --confirm "ADMIT:$new_id" > "$root/admission.json"
          ./build/native-real/smartcar_blockchain append --identity "$vehicle" --ledger "$root/ledger.json" --event "V3.0.3:MIXED" > "$root/mixed-report.json"
          python - "$root/mixed-report.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['verified'] is True
          assert report['migration_state']=='MIXED_GENERATION_VERIFIED'
          assert report['historical_generation_blocks'] >= 1
          assert report['current_generation_blocks'] >= 1
          assert report['historical_ml_kem_decapsulation_verified'] is False
          assert report['historical_kem_claim_is_authoritative'] is False
          PY
          mkdir -p security-reports/v303
          cp "$root/mixed-report.json" security-reports/v303/mixed-generation-runtime.json
          cp "$root/admission.json" security-reports/v303/trust-admission.json

      - name: Run PQC rollback and recovery-state validation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v303-state"
          vehicle="SMARTCAR_V303_STATE"
          rm -rf "$root" && mkdir -p "$root"
          export SMARTCAR_CPP_PQC_KEYSTORE_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_KEYSTORE_PATH="$root/identity.json"
          export SMARTCAR_CPP_PQC_TRUST_KEYRING_PATH="$root/trust.json"
          export SMARTCAR_CPP_PQC_TRUST_MAX_GENERATIONS=8
          export SMARTCAR_CPP_PQC_ROTATION_ENABLED=1
          export SMARTCAR_CPP_PQC_ROLLBACK_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_CPP_PQC_ROLLBACK_ANCHOR_PATH="$root/anchor.json"
          export SMARTCAR_CPP_PQC_PROVIDER=software_encrypted_file
          export SMARTCAR_CPP_PQC_HARDWARE_REQUIRED=0
          ./build/native-real/smartcar_pqc_trust_admin init --identity "$vehicle" >/dev/null
          active="$(./build/native-real/smartcar_pqc_key_admin inspect --identity "$vehicle" | python -c 'import json,sys; print(json.load(sys.stdin)["key_id"])')"
          ./build/native-real/smartcar_pqc_state_admin anchor-init --identity "$vehicle" --confirm "ANCHOR:$active" > "$root/anchor-root.json"
          ./build/native-real/smartcar_pqc_key_admin rotate --identity "$vehicle" --reason "v3.0.3 rollback anchor validation" --confirm "ROTATE:$active" --rotation-dir "$root/rotations" > "$root/rotation.json"
          backup="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["backup_path"])' "$root/rotation.json")"
          new_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["new_key_id"])' "$root/rotation.json")"
          ./build/native-real/smartcar_pqc_trust_admin admit --identity "$vehicle" --previous-keystore "$backup" --reason "v3.0.3 rollback anchor validation" --confirm "ADMIT:$new_id" >/dev/null
          ./build/native-real/smartcar_pqc_state_admin recovery-check --identity "$vehicle" --previous-keystore "$backup" > "$root/recovery.json"
          ./build/native-real/smartcar_pqc_state_admin anchor-advance --identity "$vehicle" --confirm "ADVANCE:$new_id" > "$root/anchor-advanced.json"
          python - "$root/recovery.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['candidate_admitted_historical'] is True
          assert report['automatic_restore_allowed'] is False
          assert report['rollback_anchor_must_not_be_decremented'] is True
          PY
          mkdir -p security-reports/v303
          cp "$root/recovery.json" security-reports/v303/recovery-check.json
          cp "$root/anchor-advanced.json" security-reports/v303/rollback-anchor.json

      - name: Verify hardware-provider modes fail closed when unavailable
        shell: bash
        run: |
          set -euo pipefail
          for provider in tpm2 pkcs11 hsm; do
            set +e
            SMARTCAR_CPP_PQC_PROVIDER="$provider" SMARTCAR_CPP_PQC_HARDWARE_REQUIRED=1 \
              SMARTCAR_CPP_DATA_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
              SMARTCAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
              SMARTCAR_CPP_PQC_KEYSTORE_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
              SMARTCAR_CPP_PQC_KEYSTORE_PATH="$RUNNER_TEMP/$provider.json" \
              ./build/native-real/smartcar_blockchain --self-test >/dev/null 2>&1
            status=$?
            set -e
            test "$status" -ne 0
            test ! -e "$RUNNER_TEMP/$provider.json"
          done

      - name: Normalize Go formatting for validation
        working-directory: api/go
        run: gofmt -w .

      - name: Run Go security tests and fuzz seed corpus
        working-directory: api/go
        run: go test ./... -count=1

      - name: Run bounded Go fuzz campaigns
        working-directory: api/go
        run: |
          go test -run=^$ -fuzz=FuzzSafeChainPathConfined -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzControlAPIMalformedEmergency -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzHealthChallengeParser -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzControlAPIUnsignedMutation -fuzztime=2s -timeout=30s

      - name: Build Go backend validation binary
        working-directory: api/go
        run: go build -trimpath -o ../../build/smartcar_go_backend-v3.0.3-linux-amd64 .

      - name: Package v3.0.3 Linux validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          package_dir="security-reports/v3.0.3-linux-amd64"
          mkdir -p "$package_dir"
          cp build/native-real/smartcar_blockchain "$package_dir/smartcar_blockchain-v3.0.3-linux-amd64"
          cp build/smartcar_go_backend-v3.0.3-linux-amd64 "$package_dir/"
          cp VERSION "$package_dir/"
          cp docs/releases/v3.0.3.md "$package_dir/RELEASE_NOTES.md"
          cp security-reports/release-integrity-manifest.json "$package_dir/"
          cp security-reports/sbom-v3.0.3.cdx.json "$package_dir/"
          cp security-reports/provenance-v3.0.3.json "$package_dir/"
          cp -r security-reports/v303 "$package_dir/"
          (cd "$package_dir" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload v3.0.3 final-hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: omniguard-v3.0.3-final-hardening
          path: security-reports/
          if-no-files-found: error
          retention-days: 14
