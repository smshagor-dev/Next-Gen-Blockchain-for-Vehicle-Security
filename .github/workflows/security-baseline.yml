name: Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go/go.mod

      - name: Compile hardened Python modules
        run: |
          python -m py_compile env_config.py sync_protocol.py did_identity.py v2x_protocol.py control_api_security.py smartcar_backend.py

      - name: Run Python security regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_security_baseline
          python -m unittest -v tests.test_sync_protocol_security
          python -m unittest -v tests.test_did_one_time_security
          python -m unittest -v tests.test_v2x_security
          python -m unittest -v tests.test_control_api_security

      - name: Format-check Go backend
        working-directory: api/go
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go security tests
        working-directory: api/go
        run: |
          go test ./... -count=1

      - name: Build Go backend
        working-directory: api/go
        run: |
          go build ./...
