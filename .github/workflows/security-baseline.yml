name: Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/**
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: api/go/go.mod

      - name: Compile hardened Python modules
        run: |
          python -m py_compile release_metadata.py credential_policy.py key_provider.py runtime_isolation.py runtime_security_monitor.py runtime_backend_security.py runtime_backend_patch.py incident_response.py incident_response_runtime.py incident_response_validation.py env_config.py replay_security.py permissioned_consensus.py consensus_security.py identity_security.py sync_protocol_legacy.py sync_protocol.py did_identity.py v2x_protocol.py control_api_security.py ledger_integrity.py adversarial_validation.py hil_security_validation.py smartcar_backend.py main.py

      - name: Run Python security regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_release_version
          python -m unittest -v tests.test_security_baseline
          python -m unittest -v tests.test_credential_policy
          python -m unittest -v tests.test_key_runtime_security
          python -m unittest -v tests.test_permissioned_consensus
          python -m unittest -v tests.test_consensus_security
          python -m unittest -v tests.test_identity_security
          python -m unittest -v tests.test_sync_protocol_security
          python -m unittest -v tests.test_replay_flood_security
          python -m unittest -v tests.test_runtime_security_monitor
          python -m unittest -v tests.test_runtime_security_hooks
          python -m unittest -v tests.test_incident_response
          python -m unittest -v tests.test_did_one_time_security
          python -m unittest -v tests.test_v2x_security
          python -m unittest -v tests.test_control_api_security
          python -m unittest -v tests.test_ledger_integrity
          python -m unittest -v tests.test_adversarial_validation
          python -m unittest -v tests.test_hil_security_validation
          python -m unittest -v tests.test_native_build_security

      - name: Verify canonical release identity
        env:
          PYTHONPATH: .
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "3.0.2"
          python - <<'PY'
          from release_metadata import RELEASE_VERSION, release_metadata
          from security_capabilities import security_capability_output
          assert RELEASE_VERSION == "3.0.2"
          assert release_metadata()["internal_hardening_phase"] == "v3.2"
          assert security_capability_output(False)["release_version"] == "3.0.2"
          PY

      - name: Run deterministic adversarial campaigns
        env:
          PYTHONPATH: .
        run: |
          python adversarial_validation.py \
            --seed 168938023 \
            --iterations 256 \
            --max-duration-sec 20 \
            --output security-reports/adversarial-validation.json

      - name: Run deterministic software HIL security scenarios
        env:
          PYTHONPATH: .
        run: |
          python hil_security_validation.py \
            --output security-reports/hil-security-validation.json

      - name: Run deterministic incident-response scenarios
        env:
          PYTHONPATH: .
        run: |
          python incident_response_validation.py \
            --output security-reports/incident-response-validation.json

      - name: Verify hardened native target fails closed without liboqs
        shell: bash
        run: |
          set +e
          cmake -S . -B build/native-strict \
            -DSMARTCAR_FORCE_PQC_UNAVAILABLE_FOR_TESTS=ON \
            -DSMARTCAR_FETCH_PINNED_LIBOQS=OFF \
            -DSMARTCAR_BUILD_LEGACY_CPP_DEMO=OFF \
            -DSMARTCAR_BUILD_CAMERA_MODULE=OFF \
            > build/native-strict.log 2>&1
          status=$?
          set -e
          cat build/native-strict.log
          if [ "$status" -eq 0 ]; then
            echo "Hardened native configure unexpectedly succeeded without liboqs."
            exit 1
          fi
          grep -F "Real liboqs is required for the hardened native blockchain target" build/native-strict.log

      - name: Build isolated legacy C++ demo target
        run: |
          cmake -S . -B build/native-legacy \
            -DSMARTCAR_BUILD_BLOCKCHAIN=OFF \
            -DSMARTCAR_BUILD_LEGACY_CPP_DEMO=ON \
            -DSMARTCAR_FORCE_PQC_UNAVAILABLE_FOR_TESTS=ON \
            -DSMARTCAR_ENABLE_NATIVE_OPT=OFF \
            -DSMARTCAR_ENABLE_UNSAFE_FAST_MATH=OFF \
            -DSMARTCAR_ENABLE_IPO=OFF \
            -DSMARTCAR_BUILD_CAMERA_MODULE=OFF
          cmake --build build/native-legacy --config Release --target smartcar_blockchain_legacy_demo --parallel 2

      - name: Build pinned real-PQC native target
        run: |
          cmake -S . -B build/native-real \
            -DSMARTCAR_FETCH_PINNED_LIBOQS=ON \
            -DSMARTCAR_BUILD_LEGACY_CPP_DEMO=OFF \
            -DSMARTCAR_ENABLE_NATIVE_OPT=OFF \
            -DSMARTCAR_ENABLE_UNSAFE_FAST_MATH=OFF \
            -DSMARTCAR_ENABLE_IPO=OFF \
            -DSMARTCAR_BUILD_CAMERA_MODULE=OFF
          grep -F "CMAKE_PROJECT_VERSION:STATIC=3.0.2" build/native-real/CMakeCache.txt
          cmake --build build/native-real --config Release --target smartcar_blockchain --parallel 2

      - name: Run secure native crypto self-test
        shell: bash
        run: |
          export SMARTCAR_CPP_DATA_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export SMARTCAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          ./build/native-real/smartcar_blockchain --self-test

      - name: Normalize Go formatting for validation
        working-directory: api/go
        run: |
          gofmt -w .

      - name: Run Go security tests and fuzz seed corpus
        working-directory: api/go
        run: |
          go test ./... -count=1

      - name: Run bounded Go fuzz campaigns
        working-directory: api/go
        run: |
          go test -run=^$ -fuzz=FuzzSafeChainPathConfined -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzControlAPIMalformedEmergency -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzHealthChallengeParser -fuzztime=2s -timeout=30s
          go test -run=^$ -fuzz=FuzzControlAPIUnsignedMutation -fuzztime=2s -timeout=30s

      - name: Build Go backend
        working-directory: api/go
        run: |
          go build ./...

      - name: Upload adversarial validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-validation-report
          path: security-reports/adversarial-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload software HIL security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-security-validation-report
          path: security-reports/hil-security-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload incident-response validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-response-validation-report
          path: security-reports/incident-response-validation.json
          if-no-files-found: warn
          retention-days: 14
