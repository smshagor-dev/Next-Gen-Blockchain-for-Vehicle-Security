name: Claim Validity Research
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/claim_validation/**'
      - 'tests/test_claim_validation_consensus_probe.py'
      - '.github/workflows/claim-validity-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consensus-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual-engine regression controls
        run: python -m unittest tests.test_claim_validation_consensus_probe -v
      - name: Execute exploratory runtime campaign
        run: python -m experiments.claim_validation.consensus_probe --out claim-results/consensus
      - name: Preserve raw traces and provenance
        uses: actions/upload-artifact@v4
        with:
          name: claim-validity-consensus-pilot
          path: claim-results/consensus/
          if-no-files-found: error
