name: Network actuation isolation regression
on:
  pull_request:
  workflow_dispatch:
jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_network_actuation_isolation.py' -v
      - run: python -m py_compile hardware_bridge.py tests/test_network_actuation_isolation.py
