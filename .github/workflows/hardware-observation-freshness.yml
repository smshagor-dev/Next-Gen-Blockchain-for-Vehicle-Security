name: Hardware observation freshness contracts
on:
  pull_request:
    paths:
      - 'hardware_observation_freshness.py'
      - 'hardware_bridge.py'
      - 'tests/test_hardware_observation_freshness.py'
      - '.github/workflows/hardware-observation-freshness.yml'
  workflow_dispatch:
jobs:
  freshness-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run signed-observation age contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_hardware_observation_freshness.py' -v
      - name: Compile hardware ingress modules
        run: python -m py_compile hardware_bridge.py hardware_observation_freshness.py
