name: Incident World and Hub Capture Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/v2x/join_world_capture.py"
      - "tests/test_join_world_capture.py"
      - "paper/incident-world-capture-evidence-protocol.md"
      - ".github/workflows/incident-world-capture-integrity.yml"
  push:
    branches: [main]
    paths:
      - "experiments/v2x/join_world_capture.py"
      - "tests/test_join_world_capture.py"
      - "paper/incident-world-capture-evidence-protocol.md"
      - ".github/workflows/incident-world-capture-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile independent-world joiner
        run: python -m py_compile experiments/v2x/join_world_capture.py tests/test_join_world_capture.py
      - name: Run world-truth coverage and exporter integrity contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_join_world_capture
          python -m unittest -v tests.test_incident_split_audit
          python -m unittest -v tests.test_v2x_admission_replay
      - name: Check no actual dataset or exporter secrets are committed
        run: |
          test ! -f tests/hub_exporter_secret.bin
          test ! -f experiments/v2x/world_truth_original.csv
          echo "All fixture claims and tests are synthetic software checks only."
