name: Research Evidence Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/**"
      - "tests/test_experiment_framework.py"
      - "paper/**"
      - ".github/workflows/research-evidence.yml"
      - "requirements-experiments.txt"
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "tests/test_experiment_framework.py"
      - "paper/**"
      - ".github/workflows/research-evidence.yml"
      - "requirements-experiments.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime dependency
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4"
      - name: Compile experiment modules
        run: python -m compileall -q experiments tests/test_experiment_framework.py
      - name: Run experiment reporting regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_experiment_framework
