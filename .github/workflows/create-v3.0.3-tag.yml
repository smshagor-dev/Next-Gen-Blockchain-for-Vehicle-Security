name: Create OmniGuard V2X v3.0.3 Tag

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE-v3.0.3 to create the release tag from the exact current main commit"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: omniguard-v3.0.3-tag-operator
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify explicit operator confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "CREATE-v3.0.3"

      - name: Resolve exact release target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "$(tr -d '\r\n' < VERSION)" = "3.0.3"
          test -f .github/workflows/security-baseline.yml
          test -f .github/workflows/pkcs11-source-conformance.yml
          test -f .github/workflows/windows-runtime-smoke.yml
          test -f .github/workflows/release-v3.0.3.yml
          grep -Fq 'test "$GITHUB_SHA" = "$main_sha"' .github/workflows/release-v3.0.3.yml
          printf '%s\n' "$main_sha" > "$RUNNER_TEMP/v3.0.3-main-sha"

      - name: Require successful final gates on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat "$RUNNER_TEMP/v3.0.3-main-sha")"
          for workflow in "Security Baseline" "PKCS11 Source Conformance" "Windows Runtime Smoke"; do
            safe_name="$(printf '%s' "$workflow" | tr '[:upper:] ' '[:lower:]-')"
            output="$RUNNER_TEMP/${safe_name}-main-runs.json"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event push --limit 30 \
              --json headSha,status,conclusion,url > "$output"
            python3 - "$output" "$main_sha" "$workflow" <<'PY'
          import json, sys
          from pathlib import Path

          runs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target = sys.argv[2]
          workflow = sys.argv[3]
          matches = [run for run in runs if run.get("headSha") == target]
          if not matches:
              raise SystemExit(f"no {workflow} push run found for exact current main commit")
          run = matches[0]
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit(f"{workflow} for exact current main commit is not completed successfully")
          print(f"exact-main {workflow}: PASS {run.get('url', '')}")
          PY
          done

      - name: Refuse existing tag or GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v3.0.3"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then exit 1; fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
          remote_tag_status=$?
          set -e
          if [ "$remote_tag_status" -eq 0 ]; then exit 1; elif [ "$remote_tag_status" -ne 2 ]; then exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 1; fi

      - name: Create and push annotated v3.0.3 tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v3.0.3"
          main_sha="$(cat "$RUNNER_TEMP/v3.0.3-main-sha")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$main_sha" -m "OmniGuard V2X $TAG"
          git push origin "refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$main_sha"

      - name: Dispatch guarded publication workflow on the tag ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-v3.0.3.yml --repo "$GITHUB_REPOSITORY" --ref v3.0.3
