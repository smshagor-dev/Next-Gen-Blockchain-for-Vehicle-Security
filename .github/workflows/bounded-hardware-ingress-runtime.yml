name: Bounded hardware ingress runtime
on:
  pull_request:
    paths:
      - 'bounded_tcp_admission.py'
      - 'tests/test_admission_runtime.py'
      - '.github/workflows/bounded-hardware-ingress-runtime.yml'
  workflow_dispatch:
jobs:
  real-socket-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise actual local sockets under bounded saturation
        run: python -m unittest discover -s tests -p 'test_admission_runtime.py' -v
